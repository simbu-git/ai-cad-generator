[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-room-reconstruction"
version = "1.0.0"
authors = [
  { name="Final Year Engineering Candidate" },
]
description = "AI Room Reconstruction: Monocular 2D Floorplan & 3D Spatial Wireframe Synthesis"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "streamlit>=1.35.0",
    "opencv-python-headless>=4.8.0",
    "plotly>=5.18.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0"
]
