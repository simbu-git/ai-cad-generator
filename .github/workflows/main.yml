
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r github_submission/requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile github_submission/app.py
          python -m py_compile github_submission/verify_aicad.py
          python -m py_compile github_submission/cad_engine.py
          python -m py_compile github_submission/vision_pipeline.py
          python -m py_compile github_submission/pdf_generator.py

      - name: Run verification
        run: |
          cd github_submission
          python verify_aicad.py

      - name: Run verification
        run: |
          cd github_submission
          python verify_pipeline.py
